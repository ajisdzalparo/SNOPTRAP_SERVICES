services:
  snooptrap-stream:
    build: .
    container_name: snooptrap-stream
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # TURN config injected into the viewer page (values from .env, never committed).
      - TURN_URL=${TURN_URL}
      - TURN_USER=${TURN_USER}
      - TURN_PASS=${TURN_PASS}
    networks:
      - default
      - caddy

  # coturn: WebRTC TURN relay so laptop<->phone media works across strict/mobile NAT.
  # Uses host networking because TURN needs its listening port + a UDP relay range.
  # Open these on the VPS/cloud firewall: 3478/tcp, 3478/udp, 49160-49200/udp.
  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    restart: always
    network_mode: host
    command:
      - -n
      - --realm=stream-snooptrap.ajisdzalparo.com
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${TURN_EXTERNAL_IP}
      - --user=${TURN_USER}:${TURN_PASS}
      - --lt-cred-mech
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      # Hardening: never relay to private/internal ranges (blocks SSRF / LAN abuse),
      # and cap concurrent allocations so a leaked credential can't run up huge bandwidth.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --total-quota=50
      - --log-file=stdout

# Join Caddy's Docker network so the reverse proxy can resolve `snooptrap-stream:8080`.
# This must match the network the Caddy container is on (here: caddy_net). Verify with:
#   docker inspect caddy -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}'
networks:
  caddy:
    external: true
    name: caddy_net
